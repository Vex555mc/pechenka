[project]
name = "pechenka"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "mss>=9.0.2",
    "numpy>=1.24.4",
    "opencv-python>=4.11.0.86",
    "pillow>=10.4.0",
    "pyautogui>=0.9.54",
    "pynput>=1.8.2",
    "ultralytics>=8.4.190",
    "yolo>=0.3.1",
]

[project.scripts]
pechenka = "pechenka:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
